[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lab7-proof"
version = "0.1.0"
description = "Lab7 – Open Attestation Authority (OAA) API"
authors = [{ name = "Michael Judan" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "redis[hiredis]>=5.0.0",
    "pynacl>=1.5.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    "pytest>=7.0.0",
    "jinja2>=3.1.0",
    "starlette>=0.27.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]
skip-string-normalization = false
include = '\.pyi?$'
exclude = '''
/(
  \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py311"
line-length = 88
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",   # line-length handled by Black
    "B008",   # Depends() in default args is the standard FastAPI DI pattern
]
fix = true
exclude = ["build", "dist", ".venv"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
implicit_optional = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "src.app.routers.civic_mount",
    "src.app.routers.oaa.keys_page",
    "src.app.routers.oaa.models",
    "src.app.routers.oaa.policy",
    "src.app.routers.oaa.router",
    "src.app.routers.oaa.verify_history",
    "src.app.routers.quality_metrics",
    "src.app.routers.atlas",
    "src.app.utils.capsule_verify",
    "src.app.utils.security",
    "src.core.rewards.integrity_engine",
    "src.services.orchestrator.policy",
    "src.services.orchestrator.xp",
    "src.app.routers.health_redis",
]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q --tb=short"
testpaths = ["tests"]

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
known_first_party = ["app"]
